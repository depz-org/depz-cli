name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: mlugg/setup-zig@v2

      - name: Build all targets
        run: |
          mkdir -p dist
          targets="x86_64-linux-musl aarch64-linux-musl x86_64-macos aarch64-macos x86_64-windows"
          for target in $targets; do
            echo "Building $target..."
            zig build -Doptimize=ReleaseSafe -Dstrip=true -Dtarget=$target

            case "$target" in
              *windows*) bin="zig-out/bin/depz.exe"; out="depz-$target.exe" ;;
              *)         bin="zig-out/bin/depz";     out="depz-$target" ;;
            esac

            mv "$bin" "dist/$out"
            (cd dist && sha256sum "$out" > "$out.sha256")
          done
          ls -la dist/

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true