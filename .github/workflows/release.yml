name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: mlugg/setup-zig@v2

      - name: Build all targets
        run: |
          mkdir -p dist
          targets="x86_64-linux-musl:x86_64-linux \
                   aarch64-linux-musl:aarch64-linux \
                   x86_64-macos:x86_64-macos \
                   aarch64-macos:aarch64-macos \
                   x86_64-windows:x86_64-windows"
          for entry in $targets; do
            triple="${entry%%:*}"
            name="${entry##*:}"
            echo "Building $triple -> depz-$name..."
            zig build -Doptimize=ReleaseSafe -Dstrip=true -Dtarget=$triple

            case "$triple" in
              *windows*) bin="zig-out/bin/depz.exe"; out="depz-$name.exe" ;;
              *)         bin="zig-out/bin/depz";     out="depz-$name" ;;
            esac

            mv "$bin" "dist/$out"
            (cd dist && sha256sum "$out" > "$out.sha256")
          done
          ls -la dist/

      - name: Upload to release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true